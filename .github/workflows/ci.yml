name: 测试 · 构建 · 发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Windows runner 的控制台默认是 cp1252 / cp936，Python 打印中文（测试名、
# 门禁结果）会抛 UnicodeEncodeError 或花屏。统一固定为 UTF-8。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: jinghe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试 + 发版门禁
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 语法检查
        run: python -m py_compile app.py extract.py tools/check_release.py

      - name: 全量单元测试（源码，不用 exe）
        run: python -m unittest -v test_extract test_app test_kb test_components test_v10_features test_iterate test_subscription test_scheduler test_ui_layout test_smoke_harness test_v140_fixes test_v150_t4 test_v150_ocr test_v160_features test_v161_manifest test_v162_layout test_v163_features test_v164_i18n test_i18n_runtime test_ui_runtime test_ui_experience_runtime test_ui_layout_runtime test_v171_about_theme test_v171_arch_optimizations test_v172_ocr_quality test_v173_component_setup test_v176_titlebar_components test_v177_nav_icon_theme test_v178_pdf_layout test_v179_layout_robustness test_v180_vc_runtime test_v181_mirror_sources test_v182_environment_retry test_v183_titlebar_color_sync

      - name: 发版一致性门禁
        run: python tools/check_release.py --no-exe

  release:
    name: 构建后端 exe + Electron 安装包并上传 Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      # job 级变量：GitHub Actions 每步是独立进程，步骤内定义的 $version
      # 不会传给下一步。冒烟步骤要用它拼出产物路径，故放这里全局可见。
      TAG_NAME: ${{ github.ref_name }}
      VERSION: ${{ github.ref_name }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 PyInstaller（钉版）
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.11.1"

      - name: 构建单文件后端 exe
        run: python build.py

      - name: 校验产物与版本一致性
        run: python tools/check_release.py --require-exe

      # ---- Electron 外壳链（v1.1.2 起）----------------------------------
      # 后端 exe 只是 resources/backend 里的一个组件；对外主产物是 Electron
      # 安装包。CI 跑在 GitHub 境外网络，electron-builder 下载 NSIS/WinCodeSign
      # 二进制不会像国内那样卡住，因此这里走标准 electron-builder 流程。
      - name: 准备 Node（Electron 打包）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Electron 依赖（npm ci 按 lock 精确还原）
        working-directory: electron
        run: npm ci --no-audit --no-fund

      - name: 放置后端 exe 到打包目录
        shell: pwsh
        run: |
          $version = $env:VERSION -replace '^v', ''
          $src = "dist/Jinghe-$version.exe"
          if (-not (Test-Path $src)) { throw "找不到后端产物 $src" }
          # electron/backend/ 里只有被 gitignore 的 exe，git 不跟踪空目录，
          # fresh checkout 后该目录不存在——必须先建，否则 Copy-Item 失败。
          New-Item -ItemType Directory -Force -Path "electron/backend" | Out-Null
          Copy-Item -Force $src "electron/backend/Jinghe.exe"
          Write-Host "后端就位：$src -> electron/backend/Jinghe.exe"

      - name: 构建 Electron 安装包与更新元数据
        working-directory: electron
        # -p never：只产出安装包与 latest.yml，上传统一交给下方 gh CLI，
        # 避免 electron-builder 与 gh release 双上传互相 clobber。
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 冒烟验证（2026-11-22 新增）：CI 此前只验证「包能构建出来」，
      # 不验证「包能不能真的跑起来」——「托盘抛错导致打包态双击没反应且无任何
      # 提示」就是这样被放过的（构建成功但根本起不来）。
      # 后端 exe 严格校验（起不来 = 真缺陷 = 阻塞发版）；
      # Electron 外壳尽力而为，起不来时读 shell.log 如实归类原因
      # （无桌面会话等环境限制 → 放行并说明；产品缺陷 → 阻塞）。
      - name: 冒烟验证（构建产物能真的跑起来）
        run: |
          $log = "smoke.log"
          # VERSION 来自 tag 名（带 v，如 v1.2.8），产物名不带 v —— 必须去前缀
          $ver = $env:VERSION -replace '^v', ''
          python tools/smoke_test.py `
            --backend "dist/Jinghe-$ver.exe" `
            --shell "electron/release/win-unpacked/Jinghe.exe" `
            --port 54987 --timeout 90 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            # 把完整诊断以 annotation 形式打进 run 页面（页面可读，便于排查）
            $detail = (Get-Content $log -Raw) -replace "`r?`n", " | "
            Write-Host "::error title=冒烟验证失败::${detail}"
            exit 1
          }

      - name: 创建 Release 并上传全部资产
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:TAG_NAME
          $version = $env:VERSION -replace '^v', ''
          # 三类资产：后端 exe（兼容旧版 / 门禁关键字）、Electron 安装包、
          # electron-updater 更新元数据（为外壳自更新方案 A 铺路）。
          $backend = "dist/Jinghe-$version.exe"
          $setup   = "electron/release/Jinghe-$version-setup.exe"
          $latest  = "electron/release/latest.yml"
          foreach ($f in @($backend, $setup, $latest)) {
            if (-not (Test-Path $f)) { throw "找不到资产 $f" }
          }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "精核 $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
          }
          gh release upload $tag $backend --clobber
          gh release upload $tag $setup   --clobber
          gh release upload $tag $latest  --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传资产失败" }
          Write-Host "已发布 $tag：后端 exe + Electron 安装包 + latest.yml"
