name: 测试 · 构建 · 发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Windows runner 的控制台默认是 cp1252 / cp936，Python 打印中文（测试名、
# 门禁结果）会抛 UnicodeEncodeError 或花屏。统一固定为 UTF-8。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: jinghe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试 + 发版门禁
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 语法检查
        run: python -m py_compile app.py extract.py tools/check_release.py

      - name: 全量单元测试（源码，不用 exe）
        run: python -m unittest -v test_extract test_app test_kb test_components test_v10_features

      - name: 发版一致性门禁
        run: python tools/check_release.py --no-exe

  release:
    name: 构建 exe 并上传 Release 资产
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 PyInstaller（钉版）
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.11.1"

      - name: 构建单文件 exe
        run: python build.py

      - name: 校验产物与版本一致性
        run: python tools/check_release.py --require-exe

      - name: 创建 Release 并上传带版本号的 exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $asset = "Jinghe-$version.exe"
          $exe = "dist/$asset"
          if (-not (Test-Path $exe)) { throw "找不到产物 $exe（build.py 应产出带版本号资产）" }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "精核 $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
          }
          gh release upload $tag $exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传 exe 资产失败" }
          Write-Host "已发布 $tag，资产 $asset"
